
name: 🐳 deploy

on:
  push:
    tags:
    - 'v*'

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: "26"

    - run: npm ci
    - run: npm run build -s
    - run: npm test

    - name: 👼 setup ssh
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_DEPLOYER }}

    - name: 👼 trust host
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

    - name: 👼 upload
      run: |
        rsync --delete -hamz \
          --exclude "/.git" \
          --exclude "/data" \
          --exclude "/node_modules" \
          ./ deployer@${{ vars.DEPLOY_HOST }}:/home/deployer/app/

    - name: 👼 deploy script
      run: |
        ssh deployer@${{ vars.DEPLOY_HOST }} \
          "/home/deployer/app/deploy.bash"

